on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-examples:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned Roc version
        id: roc
        run: ./ci/pinned_roc_version.sh >> "$GITHUB_OUTPUT"

      - name: Install Roc
        uses: roc-lang/setup-roc@19c9da4f0158ca74c4ac27d8999c17b5c2739cbf
        with:
          version: ${{ steps.roc.outputs.version }}
          nightly-tag: ${{ steps.roc.outputs.nightly_tag }}

      - run: roc version

      - run: ./ci/all_tests.sh
